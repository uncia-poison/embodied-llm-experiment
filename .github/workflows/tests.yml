name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest
      - run: python -m compileall -q src
      - run: embodied-llm run --config configs/ci.yaml
      - run: embodied-llm doctor --config configs/manual/deepseek-web.yaml
      - run: embodied-llm doctor --config configs/manual/gemini-web.yaml
      - run: embodied-llm suite --suite configs/suites/mock-battery.yaml --plan
      - run: embodied-llm suite --suite configs/suites/mock-battery.yaml
