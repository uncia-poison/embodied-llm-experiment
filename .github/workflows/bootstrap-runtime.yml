name: bootstrap causal subject-model runtime

on:
  push:
    branches:
      - agent/causal-subject-model-runtime
    paths:
      - ".bootstrap/payload_*.b64"
      - ".github/workflows/bootstrap-runtime.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap/payload_*.b64"
      - ".github/workflows/bootstrap-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-causal-subject-model-runtime
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/causal-subject-model-runtime
          fetch-depth: 0

      - name: Assemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload_*.b64 > /tmp/runtime.b64
          base64 --decode /tmp/runtime.b64 > /tmp/runtime.zip
          echo "9a587d424f48d58f12217daa9f7e9a33fa545744d0e08cf641c213e23e8c3d5b  /tmp/runtime.zip" | sha256sum --check -

      - name: Replace repository worktree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".bootstrap" \
            ! -name ".github" \
            -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 \
            ! -name "workflows" \
            -exec rm -rf {} + || true
          find .github/workflows -mindepth 1 -maxdepth 1 \
            ! -name "bootstrap-runtime.yml" \
            -exec rm -rf {} +
          unzip -q /tmp/runtime.zip -d .
          rm -f .github/workflows/tests.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
          python -m compileall -q src
          embodied-llm run --config configs/ci.yaml
          embodied-llm suite --suite configs/suites/mock-battery.yaml
          rm -rf runs suite-runs .pytest_cache .ruff_cache build dist
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name "*.egg-info" -prune -exec rm -rf {} +

      - name: Commit materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build causal subject-model experiment runtime"
          git push origin HEAD:agent/causal-subject-model-runtime
