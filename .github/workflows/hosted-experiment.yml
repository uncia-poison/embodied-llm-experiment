name: Hosted LLM experiment

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Hosted model provider
        required: true
        type: choice
        options:
          - deepseek
          - gemini
      profile:
        description: Episode, probe-free discovery chapter, or frozen evaluation
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - episode
          - discovery
          - evaluation
      lineage_id:
        description: Required for discovery/evaluation; letters, digits, dot, underscore, hyphen
        required: false
        type: string
      variants:
        description: Evaluation memory variants, comma separated
        required: false
        default: full,empty,shuffled
        type: string
      fresh_context:
        description: Clear explicit chat history and working memory before a discovery chapter
        required: false
        default: false
        type: boolean
      acknowledgement:
        description: Type RUN to authorize an external API call
        required: true
        type: string
  push:
    paths:
      - "run-requests/*.yaml"
      - "run-requests/*.yml"

permissions:
  contents: write

concurrency:
  group: hosted-llm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMBODIED_LLM_USAGE_LOG: hosted-output/model-usage.jsonl
      HOSTED_GEMINI_MIN_INTERVAL_SECONDS: "15"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - name: Resolve allowlisted request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            fresh=()
            if [[ "${{ inputs.fresh_context }}" == "true" ]]; then
              fresh=(--fresh-context)
            fi
            python scripts/resolve_hosted_request.py \
              --provider "${{ inputs.provider }}" \
              --profile "${{ inputs.profile }}" \
              --lineage-id "${{ inputs.lineage_id }}" \
              --variants "${{ inputs.variants }}" \
              "${fresh[@]}" \
              --acknowledgement "${{ inputs.acknowledgement }}" >> "$GITHUB_OUTPUT"
          else
            request_file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^run-requests/[^/]+\.ya?ml$' | tail -n 1)"
            if [[ -z "$request_file" ]]; then
              echo "No hosted request YAML found in triggering commit" >&2
              exit 1
            fi
            python scripts/resolve_hosted_request.py --request "$request_file" >> "$GITHUB_OUTPUT"
            echo "request_file=$request_file" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify required secret and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          provider="${{ steps.request.outputs.provider }}"
          mode="${{ steps.request.outputs.mode }}"
          checkpoint="${{ steps.request.outputs.checkpoint_path }}"
          if [[ "$provider" == "deepseek" && -z "${DEEPSEEK_API_KEY}" ]]; then
            echo "Repository secret DEEPSEEK_API_KEY is not configured" >&2
            exit 1
          fi
          if [[ "$provider" == "gemini" && -z "${GEMINI_API_KEY}" ]]; then
            echo "Repository secret GEMINI_API_KEY is not configured" >&2
            exit 1
          fi
          if [[ "$mode" == "evaluation" && ! -f "$checkpoint" ]]; then
            echo "Frozen lineage checkpoint not found: $checkpoint" >&2
            exit 1
          fi
          unrelated="${{ steps.request.outputs.unrelated_checkpoint_path }}"
          if [[ -n "$unrelated" && ! -f "$unrelated" ]]; then
            echo "Unrelated lineage checkpoint not found: $unrelated" >&2
            exit 1
          fi

      - name: Record immutable launch metadata
        shell: bash
        run: |
          mkdir -p hosted-output
          cat > hosted-output/launch.json <<'JSON'
          {
            "schema_version": 2,
            "provider": "${{ steps.request.outputs.provider }}",
            "profile": "${{ steps.request.outputs.profile }}",
            "mode": "${{ steps.request.outputs.mode }}",
            "config": "${{ steps.request.outputs.config }}",
            "request_id": "${{ steps.request.outputs.request_id }}",
            "purpose": "${{ steps.request.outputs.purpose }}",
            "lineage_id": "${{ steps.request.outputs.lineage_id }}",
            "checkpoint_path": "${{ steps.request.outputs.checkpoint_path }}",
            "variants": "${{ steps.request.outputs.variants }}",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_attempt": "${{ github.run_attempt }}"
          }
          JSON
          cp "${{ steps.request.outputs.config }}" hosted-output/effective-config.yaml
          if [[ -n "${{ steps.request.outputs.request_file }}" ]]; then
            cp "${{ steps.request.outputs.request_file }}" hosted-output/request.yaml
          fi

      - name: Preflight and run experiment
        id: experiment
        shell: bash
        run: |
          set +e
          mkdir -p hosted-output
          config="${{ steps.request.outputs.config }}"
          provider="${{ steps.request.outputs.provider }}"
          mode="${{ steps.request.outputs.mode }}"
          checkpoint="${{ steps.request.outputs.checkpoint_path }}"
          interval="0"
          if [[ "$provider" == "gemini" ]]; then
            interval="${HOSTED_GEMINI_MIN_INTERVAL_SECONDS}"
          fi
          embodied-llm doctor --config "$config" \
            > >(tee hosted-output/preflight.json) \
            2> >(tee hosted-output/preflight.stderr >&2)
          status=$?
          if [[ $status -eq 0 ]]; then
            args=(
              python scripts/run_hosted_experiment.py
              --config "$config"
              --mode "$mode"
              --minimum-request-interval-seconds "$interval"
              --policy-output hosted-output/transport-policy.json
            )
            if [[ "$mode" == "discovery" ]]; then
              if [[ -f "$checkpoint" ]]; then
                args+=(--checkpoint-in "$checkpoint")
              fi
              args+=(--checkpoint-out hosted-output/latest.checkpoint.json --checkpoint-every 1)
              if [[ "${{ steps.request.outputs.fresh_context }}" == "true" ]]; then
                args+=(--fresh-context)
              fi
            elif [[ "$mode" == "evaluation" ]]; then
              args+=(
                --checkpoint-in "$checkpoint"
                --output-dir hosted-output/evaluation
                --variants "${{ steps.request.outputs.variants }}"
              )
              unrelated="${{ steps.request.outputs.unrelated_checkpoint_path }}"
              if [[ -n "$unrelated" ]]; then
                args+=(--unrelated-checkpoint "$unrelated")
              fi
            fi
            "${args[@]}" \
              > >(tee hosted-output/console-summary.json) \
              2> >(tee hosted-output/experiment.stderr >&2)
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render durable report
        if: always()
        env:
          HOSTED_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          HOSTED_PURPOSE: ${{ steps.request.outputs.purpose }}
        shell: bash
        run: |
          set +e
          root="provider-runs"
          if [[ "${{ steps.request.outputs.mode }}" == "evaluation" ]]; then
            root="hosted-output/evaluation/runs"
          fi
          python scripts/render_hosted_report.py \
            --root "$root" \
            --output hosted-output/report.md
          if [[ -d provider-runs ]]; then
            cp -R provider-runs hosted-output/provider-runs
          fi
          cat hosted-output/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Prepare private receipt and lineage update
        if: always() && steps.request.outputs.request_id != ''
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          PROVIDER: ${{ steps.request.outputs.provider }}
          PROFILE: ${{ steps.request.outputs.profile }}
          MODE: ${{ steps.request.outputs.mode }}
          PURPOSE: ${{ steps.request.outputs.purpose }}
          LINEAGE_ID: ${{ steps.request.outputs.lineage_id }}
          CONFIG_PATH: ${{ steps.request.outputs.config }}
          CHECKPOINT_PATH: ${{ steps.request.outputs.checkpoint_path }}
          VARIANTS: ${{ steps.request.outputs.variants }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}-${{ github.run_id }}
          RUN_EXIT_CODE: ${{ steps.experiment.outputs.exit_code }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="run-results/${REQUEST_ID}"
          mkdir -p "$receipt_dir"
          if [[ -f hosted-output/report.md ]]; then
            cp hosted-output/report.md "$receipt_dir/report.md"
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          exit_code = os.environ.get("RUN_EXIT_CODE", "")
          status = "success" if exit_code == "0" else "failed"
          payload = {
              "schema_version": 2,
              "request_id": os.environ["REQUEST_ID"],
              "provider": os.environ.get("PROVIDER", ""),
              "profile": os.environ.get("PROFILE", ""),
              "mode": os.environ.get("MODE", ""),
              "purpose": os.environ.get("PURPOSE", ""),
              "lineage_id": os.environ.get("LINEAGE_ID", ""),
              "config": os.environ.get("CONFIG_PATH", ""),
              "checkpoint_path": os.environ.get("CHECKPOINT_PATH", ""),
              "variants": [item for item in os.environ.get("VARIANTS", "").split(",") if item],
              "status": status,
              "exit_code": int(exit_code) if exit_code.isdigit() else None,
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_attempt": int(os.environ["RUN_ATTEMPT"]),
              "commit": os.environ["RUN_SHA"],
              "artifact_name": os.environ.get("ARTIFACT_NAME", ""),
              "actions_url": f"{os.environ['SERVER_URL']}/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          root = Path("run-results") / os.environ["REQUEST_ID"]
          (root / "receipt.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          if [[ "${RUN_EXIT_CODE}" == "0" && "$MODE" == "discovery" ]]; then
            if [[ ! -f hosted-output/latest.checkpoint.json ]]; then
              echo "Successful discovery did not produce a checkpoint" >&2
              exit 1
            fi
            lineage_dir="lineages/${LINEAGE_ID}"
            mkdir -p "$lineage_dir/history"
            embodied-llm checkpoint hosted-output/latest.checkpoint.json \
              > hosted-output/checkpoint-inspection.json
            cp hosted-output/latest.checkpoint.json "$lineage_dir/latest.checkpoint.json"
            cp hosted-output/checkpoint-inspection.json "$lineage_dir/latest.inspect.json"
            cp "$receipt_dir/receipt.json" "$lineage_dir/history/${REQUEST_ID}.receipt.json"
          fi

      - name: Upload private research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}-${{ github.run_id }}
          path: hosted-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Commit private receipt and lineage checkpoint
        if: always() && steps.request.outputs.request_id != ''
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          MODE: ${{ steps.request.outputs.mode }}
          LINEAGE_ID: ${{ steps.request.outputs.lineage_id }}
          RUN_EXIT_CODE: ${{ steps.experiment.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "embodied-llm-runner"
          git config user.email "actions@users.noreply.github.com"
          git add "run-results/${REQUEST_ID}"
          if [[ "${RUN_EXIT_CODE}" == "0" && "$MODE" == "discovery" ]]; then
            git add "lineages/${LINEAGE_ID}"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record hosted run ${REQUEST_ID} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Propagate experiment status
        if: always()
        shell: bash
        run: |
          code="${{ steps.experiment.outputs.exit_code }}"
          exit "${code:-1}"
